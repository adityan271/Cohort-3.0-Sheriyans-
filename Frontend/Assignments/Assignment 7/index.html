<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stacks  Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="board">

  <header class="board-head">
    <div class="board-head__title">
      <h1>Stacks</h1>
      <p class="board-head__sub" id="dateLine">—</p>
    </div>
    <div class="board-head__stats">
      <div class="stat">
        <span class="stat__num" id="statOpen">0</span>
        <span class="stat__label">open</span>
      </div>
      <div class="stat">
        <span class="stat__num" id="statDone">0</span>
        <span class="stat__label">done</span>
      </div>
    </div>
  </header>

  <form class="compose" id="composeForm" autocomplete="off">
    <input type="text" id="taskInput" class="compose__input" placeholder="Pin a new task…" maxlength="120">

    <div class="compose__row">
      <div class="compose__group" id="prioGroup">
        <button type="button" class="chip chip--prio" data-prio="low">Low</button>
        <button type="button" class="chip chip--prio is-active" data-prio="medium">Medium</button>
        <button type="button" class="chip chip--prio" data-prio="high">High</button>
      </div>

      <input type="date" id="dueInput" class="compose__date">

      <button type="submit" class="pin-btn">
        <span class="pin-btn__icon">📌</span> Pin it
      </button>
    </div>
  </form>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-filter="all">All<span class="tab__count" id="cAll">0</span></button>
    <button class="tab" data-filter="active">Active<span class="tab__count" id="cActive">0</span></button>
    <button class="tab" data-filter="done">Done<span class="tab__count" id="cDone">0</span></button>
    <button class="tab" data-filter="high">High priority<span class="tab__count" id="cHigh">0</span></button>
    <button class="tab" data-filter="overdue">Overdue<span class="tab__count" id="cOverdue">0</span></button>
  </nav>

  <main class="pile" id="pile"></main>

  <template id="cardTemplate">
    <article class="card" tabindex="0">
      <button class="card__pinhole" title="Mark done" aria-label="Mark done"></button>
      <div class="card__notch" aria-hidden="true"></div>
      <p class="card__text"></p>
      <div class="card__meta">
        <span class="card__prio"></span>
        <span class="card__due"></span>
      </div>
      <button class="card__delete" title="Remove task" aria-label="Remove task">✕</button>
    </article>
  </template>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
