<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YogaBar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main>
        <nav>
            <div class="one">Shop</div>

            <div class="two">
                <img src="https://www.yogabars.in/cdn/shop/files/Group_289.png?v=1698911924&width=180" alt="logo" />
            </div>

            <div class="three">
                <div class="search"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="drop"><i class="fa-solid fa-location-dot"></i></div>
                <div class="home"><i class="fa-solid fa-house"></i></div>
                <div class="cart">
                    cart<i class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>
        </nav>

        <div class="page1">
            <img src="https://www.yogabars.in/cdn/shop/files/Oats_Desk_2.jpg?v=1771910044&width=2000" alt="" />
        </div>

        <div class="page2">
            <div class="moving-text">
                <div class="con">
                    <h1>Fall in love with the Yoga way of life 🧘</h1>
                    <h1>Practice Yum-asana every day 🧘</h1>
                    <h1>All aboard the Yum Express 🧘</h1>
                    <h1>Om Nom Nom Yum 🧘</h1>
                </div>
            </div>
        </div>

        <div class="page3"></div>

    </main>

    <script src="script.js"></script>
</body>

</html>
